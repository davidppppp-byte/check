<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蒙恩聽障烘焙坊 - 服儀檢查系統</title>
    <!-- 引入工具庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .animate-shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <!-- 先載入 Firebase 並橋接至 window 變數 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        window.FirebaseSDK = {
            initializeApp, getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query,
            getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken
        };
        window.dispatchEvent(new Event('firebase-sdk-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDP2ZWDpTP28lqkBRZYX8Z8Kygv8F7aBFU",
            authDomain: "dbcheck-d435e.firebaseapp.com",
            projectId: "dbcheck-d435e",
            storageBucket: "dbcheck-d435e.firebasestorage.app",
            messagingSenderId: "106376997694",
            appId: "1:106376997694:web:ceac318fcd6a41bbd55a6f"
        };

        const APP_ID = 'grooming-check-v3';
        const ADMIN_PASSWORD = "Deaf@83576352";

        const DEPARTMENTS = ["生產中心－切割部", "生產中心－攪拌/廠務部", "生產中心－烘烤部/研發部", "生產中心－包裝部", "物流中心"];
        
        const PRODUCTION_ITEMS = [
            "不得抽煙。",
            "不得使用會脫落的裝飾品或化妝，如戴耳環、接假睫毛等。",
            "不得留指甲，保持手部與指甲間隙縫的乾淨度；禁止塗抹各類顏色的指甲油(含透明色)。",
            "不得使用有味道的身體用品，如香水或髮膠等。",
            "需戴上全覆式帽子及工作圍裙，保持乾淨不起毛球、不脫線破損及泛黃等狀況。",
            "一律穿長褲，不得穿短褲、易掉毛或有破損之衣物，例如毛衣、破褲等。",
            "襪子要超過腳踝。穿著包鞋，且保持外觀與鞋底之潔淨，不得穿拖鞋或涼鞋。"
        ];
        
        const LOGISTICS_ITEMS = [
            "不得使用會脫落的裝飾品或化妝，如戴耳環、接假睫毛等。",
            "一律穿包鞋，不得穿拖鞋或涼鞋。",
            "不得留指甲，長度不得超出指尖，且需保持手部與指甲間隙縫的乾淨度；禁止塗抹各類顏色的指甲油（包含透明色）。",
            "不得噴或擦香水或有味道的身體用品，如髮膠等。",
            "不得抽煙。"
        ];

        // 穩定版圖標組件
        const Icon = ({ name, className = "w-6 h-6" }) => {
            return <i data-lucide={name} className={className} style={{ display: 'inline-block' }}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('check');
            const [employees, setEmployees] = useState([]);
            const [records, setRecords] = useState([]);
            const [selectedDept, setSelectedDept] = useState(DEPARTMENTS[0]);
            const [loading, setLoading] = useState(true);
            const [isReady, setIsReady] = useState(false);
            
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [pwInput, setPwInput] = useState('');
            const [loginErr, setLoginErr] = useState(false);

            const [activeEmp, setActiveEmp] = useState(null);
            const [tempChecks, setTempChecks] = useState({});
            const [bulkMode, setBulkMode] = useState(false);
            const [bulkNames, setBulkNames] = useState('');
            const [newEmpName, setNewEmpName] = useState('');
            const [newEmpDept, setNewEmpDept] = useState(DEPARTMENTS[0]);

            useEffect(() => {
                const checkSDK = () => { if (window.FirebaseSDK) setIsReady(true); };
                window.addEventListener('firebase-sdk-ready', checkSDK);
                checkSDK();
                return () => window.removeEventListener('firebase-sdk-ready', checkSDK);
            }, []);

            useEffect(() => {
                if (!isReady) return;
                const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } = window.FirebaseSDK;
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);

                const initAuth = async () => {
                    try {
                        if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                            await signInWithCustomToken(auth, window.__initial_auth_token).catch(() => signInAnonymously(auth));
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) { console.error("驗證異常:", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => setUser(u));
                return () => unsubscribe();
            }, [isReady]);

            useEffect(() => {
                if (!user || !isReady) return;
                const { getFirestore, collection, onSnapshot } = window.FirebaseSDK;
                const db = getFirestore();
                setLoading(true);

                const unsubE = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'employees'), s => {
                    setEmployees(s.docs.map(d => ({id: d.id, ...d.data()})));
                    setLoading(false);
                }, e => { console.error("Employee sync error", e); setLoading(false); });

                const unsubR = onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'records'), s => {
                    setRecords(s.docs.map(d => ({id: d.id, ...d.data()})));
                }, e => console.error("Record sync error", e));

                return () => { unsubE(); unsubR(); };
            }, [user, isReady]);

            // 確保每次視圖切換或資料更新後，圖標都能正確載入
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [view, loading, activeEmp, showLogin, employees, selectedDept]);

            const getItems = (dept) => (dept === "物流中心" ? LOGISTICS_ITEMS : PRODUCTION_ITEMS);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pwInput === ADMIN_PASSWORD) {
                    setIsAdmin(true); setShowLogin(false); setPwInput('');
                    setView(view === 'check' ? 'manage' : view);
                } else { setLoginErr(true); }
            };

            const saveCheck = async () => {
                if (!activeEmp || !isReady) return;
                const { getFirestore, doc, setDoc } = window.FirebaseSDK;
                const db = getFirestore();
                const today = new Date().toISOString().split('T')[0];
                const failed = Object.keys(tempChecks).filter(k => !tempChecks[k]);
                try {
                    await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'records', `${today}_${activeEmp.id}`), {
                        employeeId: activeEmp.id, employeeName: activeEmp.name, dept: activeEmp.dept,
                        date: today, status: failed.length === 0 ? 'pass' : 'fail',
                        failedItems: failed, timestamp: new Date().toISOString()
                    });
                    setActiveEmp(null);
                } catch (err) { console.error("儲存失敗", err); }
            };

            if (loading || !isReady) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white space-y-4">
                    <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <p className="text-slate-400 font-black tracking-widest animate-pulse">系統載入中...</p>
                </div>
            );

            const todayStr = new Date().toISOString().split('T')[0];
            const filteredEmps = employees.filter(e => e.dept === selectedDept);

            return (
                <div className="max-w-md mx-auto min-h-screen relative pb-24 shadow-xl bg-slate-50">
                    <header className="bg-white/80 backdrop-blur-md border-b sticky top-0 z-40 p-5 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-slate-900 rounded-2xl flex items-center justify-center text-white shadow-lg">
                                <Icon name="clipboard-check" />
                            </div>
                            <div>
                                <h1 className="text-lg font-black leading-none tracking-tight">蒙恩服儀檢查</h1>
                                <div className="flex items-center gap-1 mt-1">
                                    <span className={`w-1.5 h-1.5 rounded-full ${user ? 'bg-green-500' : 'bg-slate-300 animate-pulse'}`} />
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">{user ? '已連線' : '待機中'}</span>
                                </div>
                            </div>
                        </div>
                        {isAdmin && (
                            <button onClick={() => setIsAdmin(false)} className="bg-amber-100 text-amber-600 px-3 py-1 rounded-full text-[10px] font-black border border-amber-200 flex items-center gap-1">
                                <Icon name="unlock" className="w-3 h-3" /> 管理中
                            </button>
                        )}
                    </header>

                    <main className="p-5 overflow-x-hidden">
                        {view === 'check' && (
                            <div className="space-y-4">
                                <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                    <label className="text-[10px] font-black text-slate-400 uppercase mb-2 block tracking-widest">檢查單位切換</label>
                                    <div className="grid gap-2">
                                        {DEPARTMENTS.map(d => (
                                            <button key={d} onClick={() => setSelectedDept(d)} className={`p-3 text-left rounded-xl border-2 transition-all font-bold text-sm flex items-center justify-between ${selectedDept === d ? 'border-blue-600 bg-blue-50 text-blue-700' : 'border-slate-50 bg-slate-50 text-slate-500'}`}>
                                                {d} {selectedDept === d && <Icon name="check" className="w-4 h-4" />}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    {filteredEmps.length === 0 ? (
                                        <div className="text-center py-12 text-slate-300 font-bold border-2 border-dashed rounded-3xl">名單為空</div>
                                    ) : (
                                        filteredEmps.map(emp => {
                                            const r = records.find(rec => rec.employeeId === emp.id && rec.date === todayStr);
                                            return (
                                                <div key={emp.id} onClick={() => {
                                                    const items = getItems(emp.dept);
                                                    setActiveEmp(emp);
                                                    setTempChecks(r ? items.reduce((a, i) => ({...a, [i]: !r.failedItems?.includes(i)}), {}) : items.reduce((a, i) => ({...a, [i]: true}), {}));
                                                }} className={`flex items-center justify-between p-4 rounded-2xl shadow-sm border-2 cursor-pointer transition-all active:scale-95 ${!r ? 'bg-white border-transparent' : r.status === 'pass' ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                                    <div className="flex items-center gap-3">
                                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black ${!r ? 'bg-slate-100 text-slate-400' : r.status === 'pass' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`}>{(emp.name || "?").charAt(0)}</div>
                                                        <div>
                                                            <div className="font-bold text-slate-800">{emp.name}</div>
                                                            <div className="text-[10px] font-bold uppercase text-slate-400">{!r ? '待點選' : r.status === 'pass' ? '今日合格' : '異常報備'}</div>
                                                        </div>
                                                    </div>
                                                    {!r ? <Icon name="chevron-right" className="text-slate-200" /> : r.status === 'pass' ? <Icon name="check-circle-2" className="text-green-500" /> : <Icon name="alert-triangle" className="text-red-500" />}
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'manage' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                                    <div className="flex justify-between items-center">
                                        <h3 className="font-black text-slate-800 flex items-center gap-2"><Icon name="user-plus" className="w-5 h-5 text-blue-600" /> 人員管理</h3>
                                        <button onClick={() => setBulkMode(!bulkMode)} className="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase">{bulkMode ? '單筆' : '批次'}</button>
                                    </div>
                                    <select className="w-full p-3 bg-slate-50 rounded-xl font-bold border-0 outline-none" value={newEmpDept} onChange={e => setNewEmpDept(e.target.value)}>{DEPARTMENTS.map(d => <option key={d}>{d}</option>)}</select>
                                    {bulkMode ? (
                                        <textarea placeholder="姓名，用逗號或換行隔開" className="w-full p-4 bg-slate-50 rounded-xl min-h-[120px] outline-none font-medium border-0" value={bulkNames} onChange={e => setBulkNames(e.target.value)} />
                                    ) : (
                                        <input type="text" placeholder="輸入姓名" className="w-full p-4 bg-slate-50 rounded-xl font-bold outline-none border-0" value={newEmpName} onChange={e => setNewEmpName(e.target.value)} />
                                    )}
                                    <button onClick={async () => {
                                        const { getFirestore, collection, addDoc } = window.FirebaseSDK;
                                        const db = getFirestore();
                                        try {
                                            if (bulkMode) {
                                                const names = bulkNames.split(/[\n,，]+/).map(n => n.trim()).filter(n => n);
                                                for (const name of names) await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'employees'), { name, dept: newEmpDept, createdAt: new Date().toISOString() });
                                                setBulkNames(''); setBulkMode(false);
                                            } else {
                                                if (!newEmpName.trim()) return;
                                                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'employees'), { name: newEmpName.trim(), dept: newEmpDept, createdAt: new Date().toISOString() });
                                                setNewEmpName('');
                                            }
                                        } catch (err) { console.error("新增失敗", err); }
                                    }} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black shadow-lg active:scale-95 transition-all">確認加入</button>
                                </div>
                                <div className="space-y-2">
                                    <h3 className="text-xs font-black text-slate-400 uppercase px-2 tracking-widest">在職清單 ({employees.length})</h3>
                                    {employees.map(e => (
                                        <div key={e.id} className="bg-white p-4 rounded-2xl flex justify-between items-center border border-slate-50 shadow-sm animate-in slide-in-from-left duration-300">
                                            <div><div className="font-bold text-slate-800">{e.name}</div><div className="text-[10px] font-black text-slate-400">{e.dept}</div></div>
                                            <button onClick={async () => {
                                                if(confirm(`確認將 ${e.name} 移除？`)) {
                                                    const { getFirestore, doc, deleteDoc } = window.FirebaseSDK;
                                                    try { await deleteDoc(doc(getFirestore(), 'artifacts', APP_ID, 'public', 'data', 'employees', e.id)); } catch (err) { console.error(err); }
                                                }
                                            }} className="p-2 text-slate-200 hover:text-red-500 transition-colors"><Icon name="trash-2" className="w-5 h-5" /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="space-y-6 animate-in slide-in-from-bottom duration-500">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-blue-600 p-5 rounded-3xl text-white shadow-lg">
                                        <div className="text-[10px] font-black uppercase opacity-60 tracking-wider">今日完成度</div>
                                        <div className="text-3xl font-black mt-1">{employees.length > 0 ? Math.round((records.filter(r => r.date === todayStr).length / employees.length) * 100) : 0}%</div>
                                    </div>
                                    <div className="bg-red-500 p-5 rounded-3xl text-white shadow-lg">
                                        <div className="text-[10px] font-black uppercase opacity-60 tracking-wider">異常數</div>
                                        <div className="text-3xl font-black mt-1">{records.filter(r => r.date === todayStr && r.status === 'fail').length}</div>
                                    </div>
                                </div>
                                <div className="space-y-3">
                                    <h3 className="text-xs font-black text-slate-400 uppercase px-2 tracking-widest">異常細節紀錄</h3>
                                    {records.filter(r => r.date === todayStr && r.status === 'fail').length === 0 ? (
                                        <div className="text-center py-12 bg-white rounded-3xl border border-dashed text-slate-300 font-bold">目前無異常</div>
                                    ) : (
                                        records.filter(r => r.date === todayStr && r.status === 'fail').map(r => (
                                            <div key={r.id} className="bg-red-50 p-4 rounded-2xl border border-red-100 animate-in slide-in-from-top duration-300">
                                                <div className="flex justify-between items-center mb-2 font-black text-red-900"><span>{r.employeeName}</span><span className="text-[10px] uppercase opacity-60 font-black">{r.dept}</span></div>
                                                <ul className="text-xs text-red-700 space-y-1 list-disc list-inside font-medium">{r.failedItems?.map((i, idx) => <li key={idx}>{i}</li>)}</ul>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer Nav */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t p-2 pb-8 z-30 flex justify-around shadow-2xl">
                        <button onClick={() => setView('check')} className={`flex flex-col items-center p-3 rounded-2xl transition-all ${view === 'check' ? 'bg-slate-900 text-white shadow-lg scale-105' : 'text-slate-400'}`}><Icon name="clipboard-check" /><span className="text-[10px] font-black mt-1 uppercase">日常檢查</span></button>
                        <button onClick={() => { if(isAdmin) setView('manage'); else { setShowLogin(true); setPwInput(''); setLoginErr(false); } }} className={`flex flex-col items-center p-3 rounded-2xl transition-all ${view === 'manage' ? 'bg-slate-900 text-white shadow-lg scale-105' : 'text-slate-400'}`}><Icon name="users" /><span className="text-[10px] font-black mt-1 uppercase">人員管理</span></button>
                        <button onClick={() => { if(isAdmin) setView('history'); else { setShowLogin(true); setPwInput(''); setLoginErr(false); } }} className={`flex flex-col items-center p-3 rounded-2xl transition-all ${view === 'history' ? 'bg-slate-900 text-white shadow-lg scale-105' : 'text-slate-400'}`}><Icon name="bar-chart-3" /><span className="text-[10px] font-black mt-1 uppercase">數據統計</span></button>
                    </nav>

                    {/* Modals */}
                    {activeEmp && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center">
                            <div className="bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-300">
                                <div className="p-6 bg-slate-50 border-b flex justify-between items-center">
                                    <div><h3 className="text-xl font-black text-slate-800">{activeEmp.name}</h3><p className="text-[10px] font-black text-slate-400 uppercase tracking-tighter">{activeEmp.dept}</p></div>
                                    <button onClick={() => setActiveEmp(null)} className="p-2 text-slate-300 hover:text-slate-900"><Icon name="x" /></button>
                                </div>
                                <div className="p-5 max-h-[60vh] overflow-y-auto space-y-3 no-scrollbar">
                                    <button onClick={() => { const items = getItems(activeEmp.dept); setTempChecks(items.reduce((a, i) => ({...a, [i]: true}), {})); }} className="w-full py-4 bg-green-500 text-white rounded-2xl font-black shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-all"><Icon name="check" className="w-5 h-5" /> 全部項目合格</button>
                                    <div className="h-4 border-b border-slate-100" />
                                    {getItems(activeEmp.dept).map((item, idx) => (
                                        <div key={idx} onClick={() => setTempChecks(p => ({...p, [item]: !p[item]}))} className={`p-4 rounded-xl border-2 flex gap-4 transition-all cursor-pointer ${tempChecks[item] ? 'border-slate-100 bg-white' : 'border-red-500 bg-red-50 shadow-md'}`}>
                                            <div className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center flex-shrink-0 transition-all ${tempChecks[item] ? 'border-slate-200' : 'bg-red-500 border-red-500 text-white'}`}>{!tempChecks[item] && <Icon name="check" className="w-4 h-4" />}</div>
                                            <span className={`text-sm font-bold ${tempChecks[item] ? 'text-slate-500 font-medium' : 'text-red-700 font-black'}`}>{item}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-5 border-t grid grid-cols-3 gap-3 bg-white">
                                    <button onClick={async () => {
                                        if(confirm('確認清除今日檢查紀錄？')) { 
                                            const { getFirestore, doc, deleteDoc } = window.FirebaseSDK;
                                            try { await deleteDoc(doc(getFirestore(), 'artifacts', APP_ID, 'public', 'data', 'records', `${todayStr}_${activeEmp.id}`)); setActiveEmp(null); } catch (e) { console.error(e); } 
                                        } 
                                    }} className="text-slate-400 text-[10px] font-black uppercase">清除紀錄</button>
                                    <button onClick={saveCheck} className="col-span-2 bg-slate-900 text-white py-4 rounded-2xl font-black shadow-xl active:scale-95 transition-all">確認儲存</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showLogin && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] flex items-center justify-center p-6">
                            <div className="bg-white w-full max-w-sm rounded-[32px] p-8 text-center shadow-2xl animate-in zoom-in-95">
                                <Icon name="lock" className="w-12 h-12 text-blue-600 mx-auto mb-4" />
                                <h2 className="text-2xl font-black mb-2 text-slate-800">管理人員登入</h2>
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <input autoFocus type="password" placeholder="請輸入管理密碼" className={`w-full p-4 bg-slate-100 rounded-2xl text-center text-xl font-bold border-2 transition-all outline-none ${loginErr ? 'border-red-500 animate-shake' : 'border-transparent'}`} value={pwInput} onChange={e => {setPwInput(e.target.value); setLoginErr(false);}} />
                                    <button type="submit" className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-xl hover:bg-blue-700 transition-all">驗證並進入</button>
                                    <button type="button" onClick={() => setShowLogin(false)} className="text-slate-400 text-sm font-black uppercase mt-2">取消</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
