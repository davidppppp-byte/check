<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蒙恩聽障烘焙坊 - 服儀檢查系統</title>
    
    <!-- 1. 引入基礎工具 (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 2. 引入 Firebase 相容版 SDK (最穩定) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }
        .animate-shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .active-scale:active { transform: scale(0.96); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 1. 配置與常數 ---
        const firebaseConfig = {
            apiKey: "AIzaSyDP2ZWDpTP28lqkBRZYX8Z8Kygv8F7aBFU",
            authDomain: "dbcheck-d435e.firebaseapp.com",
            projectId: "dbcheck-d435e",
            storageBucket: "dbcheck-d435e.firebasestorage.app",
            messagingSenderId: "106376997694",
            appId: "1:106376997694:web:ceac318fcd6a41bbd55a6f"
        };

        const APP_ID = 'grooming-check-v3';
        const ADMIN_PASSWORD = "Deaf@83576352";

        const DEPARTMENTS = ["生產中心－切割部", "生產中心－攪拌/廠務部", "生產中心－烘烤部/研發部", "生產中心－包裝部", "物流中心"];
        
        const PRODUCTION_ITEMS = [
            "不得抽煙。",
            "不得使用會脫落的裝飾品或化妝，如戴耳環、接假睫毛等。",
            "不得留指甲，保持手部與指甲間隙縫的乾淨度；禁止塗抹各類顏色的指甲油(含透明色)。",
            "不得使用有味道的身體用品，如香水或髮膠等。",
            "需戴上全覆式帽子及工作圍裙，保持乾淨不起毛球、不脫線破損及泛黃等狀況。",
            "一律穿長褲，不得穿短褲、易掉毛或有破損之衣物，例如毛衣、破褲等。",
            "襪子要超過腳踝。穿著包鞋，且保持外觀與鞋底之潔淨，不得穿拖鞋或涼鞋。"
        ];
        
        const LOGISTICS_ITEMS = [
            "不得使用會脫落的裝飾品或化妝，如戴耳環、接假睫毛等。",
            "一律穿包鞋，不得穿拖鞋或涼鞋。",
            "不得留指甲，長度不得超出指尖，且需保持手部與指甲間隙縫的乾淨度；禁止塗抹各類顏色的指甲油（包含透明色）。",
            "不得噴或擦香水或有味道的身體用品，如髮膠等。",
            "不得抽煙。"
        ];

        // --- 2. 穩定版 SVG 圖標元件 ---
        const Icon = ({ name, className = "w-6 h-6" }) => {
            const icons = {
                'check': <path d="M20 6 9 17l-5-5" />,
                'x': <path d="M18 6 6 18M6 6l12 12" />,
                'clipboard': <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 2h6v4H9z" />,
                'users': <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />,
                'chart': <path d="M3 3v18h18M7 16v-4M11 16V9M15 16V5M19 16V9" />,
                'chevron-right': <path d="m9 18 6-6-6-6" />,
                'success': <g><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g>,
                'alert': <g><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3ZM12 9v4M12 17h.01" /></g>,
                'trash': <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6" />,
                'plus': <path d="M12 5v14M5 12h14" />,
                'user-plus': <g><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></g>,
                'lock': <g><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>,
                'unlock': <g><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1" /></g>,
                'package': <path d="M16.5 9.4 7.5 4.21M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16zM3.27 6.96 12 12.01l8.73-5.05M12 22.08V12" />,
                'medal': <g><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><circle cx="12" cy="15" r="5"/><path d="M12 18V12"/></g>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} style={{ flexShrink: 0 }}>
                    {icons[name] || null}
                </svg>
            );
        };

        // --- 3. 應用程式主體 ---
        const App = () => {
            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('check');
            const [employees, setEmployees] = useState([]);
            const [records, setRecords] = useState([]);
            const [selectedDept, setSelectedDept] = useState(DEPARTMENTS[0]);
            const [loading, setLoading] = useState(true);
            
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [pwInput, setPwInput] = useState('');
            const [loginErr, setLoginErr] = useState(false);

            const [activeEmp, setActiveEmp] = useState(null);
            const [tempChecks, setTempChecks] = useState({});
            const [bulkMode, setBulkMode] = useState(false);
            const [bulkNames, setBulkNames] = useState('');
            const [newEmpName, setNewEmpName] = useState('');
            const [newEmpDept, setNewEmpDept] = useState(DEPARTMENTS[0]);

            // 安全獲取今日日期
            const todayStr = useMemo(() => new Date().toISOString().split('T')[0], [view]);

            // 初始化 Firebase SDK
            useEffect(() => {
                if (!window.firebase.apps.length) {
                    window.firebase.initializeApp(firebaseConfig);
                }
                const _db = window.firebase.firestore();
                const _auth = window.firebase.auth();
                setDb(_db);
                setAuth(_auth);

                const unsubscribe = _auth.onAuthStateChanged((u) => {
                    if (!u) {
                        _auth.signInAnonymously().catch(err => console.error("Auth Error", err));
                    }
                    setUser(u);
                });
                return () => unsubscribe();
            }, []);

            // 數據即時同步
            useEffect(() => {
                if (!user || !db) return;
                setLoading(true);
                
                const eRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('employees');
                const rRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('records');

                const unsubE = eRef.onSnapshot(s => {
                    setEmployees(s.docs.map(d => ({ id: d.id, ...d.data() })));
                    setLoading(false);
                }, err => { console.error("Employee sync fail", err); setLoading(false); });

                const unsubR = rRef.onSnapshot(s => {
                    setRecords(s.docs.map(d => ({ id: d.id, ...d.data() })));
                }, err => console.error("Records sync fail", err));

                return () => { unsubE(); unsubR(); };
            }, [user, db]);

            const getItems = (dept) => (dept === "物流中心" ? LOGISTICS_ITEMS : PRODUCTION_ITEMS);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pwInput === ADMIN_PASSWORD) {
                    setIsAdmin(true); setShowLogin(false); setPwInput('');
                    setView(view === 'check' ? 'manage' : view);
                } else { setLoginErr(true); }
            };

            const toggleCheckItem = (item) => {
                setTempChecks(prev => ({ ...prev, [item]: !prev[item] }));
            };

            const saveCheck = async () => {
                if (!activeEmp || !db) return;
                const failed = Object.keys(tempChecks).filter(k => !tempChecks[k]);
                try {
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('records')
                        .doc(`${todayStr}_${activeEmp.id}`).set({
                            employeeId: activeEmp.id, 
                            employeeName: activeEmp.name || "未知人員", 
                            dept: activeEmp.dept || "未知單位",
                            date: todayStr, 
                            status: failed.length === 0 ? 'pass' : 'fail',
                            failedItems: failed, 
                            timestamp: new Date().toISOString()
                        });
                    setActiveEmp(null);
                } catch (err) { console.error("Save failed", err); }
            };

            const currentDeptEmps = useMemo(() => {
                return (employees || []).filter(e => e && e.dept === selectedDept);
            }, [employees, selectedDept]);

            // 計算年度表現數據
            const annualStats = useMemo(() => {
                const currentYear = new Date().getFullYear().toString();
                const yearRecords = (records || []).filter(r => r && r.date && r.date.startsWith(currentYear));
                
                return (employees || []).map(emp => {
                    const empRecs = yearRecords.filter(r => r.employeeId === emp.id);
                    const failCount = empRecs.filter(r => r.status === 'fail').length;
                    const totalCount = empRecs.length;
                    const passRate = totalCount > 0 ? Math.round(((totalCount - failCount) / totalCount) * 100) : 100;
                    
                    return {
                        ...emp,
                        failCount,
                        totalCount,
                        passRate
                    };
                }).sort((a, b) => a.passRate - b.passRate); // 預設將狀況較多(合格率低)的排在前面，方便查看
            }, [employees, records]);

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white space-y-4">
                    <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <p className="text-slate-400 font-black tracking-widest animate-pulse uppercase text-xs">蒙恩系統載入中</p>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen relative pb-24 shadow-2xl bg-slate-50 border-x border-slate-200">
                    {/* Header */}
                    <header className="bg-white/95 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40 p-5 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-slate-900 rounded-2xl flex items-center justify-center text-white"><Icon name="clipboard" className="w-5 h-5" /></div>
                            <div>
                                <h1 className="text-lg font-black leading-none tracking-tight text-slate-800">蒙恩服儀檢查</h1>
                                <div className="flex items-center gap-1 mt-1">
                                    <span className={`w-1.5 h-1.5 rounded-full ${user ? 'bg-green-500' : 'bg-slate-300'}`} />
                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">{user ? '雲端連線正常' : '連線中'}</span>
                                </div>
                            </div>
                        </div>
                        {isAdmin && (
                            <button onClick={() => setIsAdmin(false)} className="bg-amber-100 text-amber-600 px-3 py-1 rounded-full text-[10px] font-black border border-amber-200 flex items-center gap-1 active-scale">
                                <Icon name="unlock" className="w-3 h-3" /> 已授權
                            </button>
                        )}
                    </header>

                    <main className="p-5">
                        {view === 'check' && (
                            <div className="space-y-4 animate-in fade-in duration-300">
                                <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                    <label className="text-[10px] font-black text-slate-400 uppercase mb-2 block tracking-widest text-center">切換檢查單位</label>
                                    <div className="grid gap-2">
                                        {DEPARTMENTS.map(d => (
                                            <button key={d} onClick={() => setSelectedDept(d)} className={`p-3 text-left rounded-xl border-2 transition-all font-bold text-sm flex items-center justify-between active-scale ${selectedDept === d ? 'border-blue-600 bg-blue-50 text-blue-700' : 'border-slate-50 bg-slate-50 text-slate-500'}`}>
                                                <span className="truncate pr-2">{d}</span> {selectedDept === d && <Icon name="check" className="w-4 h-4" />}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    {currentDeptEmps.length === 0 ? (
                                        <div className="text-center py-12 text-slate-300 font-bold border-2 border-dashed rounded-3xl">名單為空</div>
                                    ) : (
                                        currentDeptEmps.map(emp => {
                                            const r = (records || []).find(rec => rec && rec.employeeId === emp.id && rec.date === todayStr);
                                            return (
                                                <div key={emp.id} onClick={() => {
                                                    const items = getItems(emp.dept);
                                                    setActiveEmp(emp);
                                                    setTempChecks(r ? items.reduce((a, i) => ({...a, [i]: !r.failedItems?.includes(i)}), {}) : items.reduce((a, i) => ({...a, [i]: true}), {}));
                                                }} className={`flex items-center justify-between p-4 rounded-2xl shadow-sm border-2 cursor-pointer transition-all active-scale ${!r ? 'bg-white border-transparent' : r.status === 'pass' ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                                    <div className="flex items-center gap-3 flex-1 min-w-0">
                                                        <div className={`w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center font-black ${!r ? 'bg-slate-100 text-slate-400' : r.status === 'pass' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`}>{(emp.name || "?").charAt(0)}</div>
                                                        <div className="truncate">
                                                            <div className="font-bold text-slate-800 truncate">{emp.name}</div>
                                                            <div className="text-[10px] font-bold uppercase text-slate-400">{!r ? '待檢' : r.status === 'pass' ? '合格' : '異常報備'}</div>
                                                        </div>
                                                    </div>
                                                    <div className="flex-shrink-0 ml-2">
                                                        {!r ? <Icon name="chevron-right" className="w-5 h-5 text-slate-200" /> : r.status === 'pass' ? <Icon name="success" className="w-6 h-6 text-green-500" /> : <Icon name="alert" className="w-6 h-6 text-red-500" />}
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'manage' && (
                            <div className="space-y-6 animate-in slide-in-from-bottom duration-300">
                                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                                    <div className="flex justify-between items-center"><h3 className="font-black text-slate-800 flex items-center gap-2"><Icon name="user-plus" className="w-5 h-5" /> 人員異動</h3><button onClick={() => setBulkMode(!bulkMode)} className="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-tighter">{bulkMode ? '單筆' : '批次'}</button></div>
                                    <select className="w-full p-3 bg-slate-50 rounded-xl font-bold border-0 outline-none text-sm" value={newEmpDept} onChange={e => setNewEmpDept(e.target.value)}>{DEPARTMENTS.map(d => <option key={d}>{d}</option>)}</select>
                                    {bulkMode ? <textarea placeholder="批次模式：姓名，用逗號或換行隔開" className="w-full p-4 bg-slate-50 rounded-xl min-h-[120px] outline-none font-medium border-0 text-sm" value={bulkNames} onChange={e => setBulkNames(e.target.value)} /> : <input type="text" placeholder="單筆模式：輸入員工姓名" className="w-full p-4 bg-slate-50 rounded-xl font-bold outline-none border-0 text-sm" value={newEmpName} onChange={e => setNewEmpName(e.target.value)} />}
                                    <button onClick={async () => {
                                        try {
                                            const col = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('employees');
                                            if (bulkMode) {
                                                const names = bulkNames.split(/[\n,，]+/).map(n => n.trim()).filter(n => n);
                                                for (const name of names) await col.add({ name, dept: newEmpDept, createdAt: new Date().toISOString() });
                                                setBulkNames(''); setBulkMode(false);
                                            } else {
                                                if (!newEmpName.trim()) return;
                                                await col.add({ name: newEmpName.trim(), dept: newEmpDept, createdAt: new Date().toISOString() });
                                                setNewEmpName('');
                                            }
                                        } catch (e) { console.error("Update fail", e); }
                                    }} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black shadow-lg active-scale">確認加入系統</button>
                                </div>
                                <div className="space-y-2">
                                    <h3 className="text-xs font-black text-slate-400 uppercase px-2 tracking-widest">目前名單 ({employees.length})</h3>
                                    {employees.map(e => (
                                        <div key={e.id} className="bg-white p-4 rounded-2xl flex justify-between items-center border border-slate-50 shadow-sm animate-in fade-in duration-300">
                                            <div className="min-w-0 flex-1 pr-4">
                                                <div className="font-bold text-slate-800 truncate">{e.name}</div>
                                                <div className="text-[10px] text-slate-400 truncate">{e.dept}</div>
                                            </div>
                                            <button onClick={async () => {
                                                if(confirm(`確認將 ${e.name} 從名單移除？`)) {
                                                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('employees').doc(e.id).delete();
                                                }
                                            }} className="p-2 text-slate-200 hover:text-red-500 flex-shrink-0 transition-colors"><Icon name="trash" className="w-5 h-5" /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="space-y-6 animate-in slide-in-from-bottom duration-300">
                                {/* 頂部今日摘要 */}
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-blue-600 p-5 rounded-3xl text-white shadow-lg shadow-blue-100">
                                        <div className="text-[10px] font-black uppercase opacity-60 tracking-wider">今日完成率</div>
                                        <div className="text-3xl font-black mt-1">{employees.length > 0 ? Math.round(((records || []).filter(r => r && r.date === todayStr).length / employees.length) * 100) : 0}%</div>
                                    </div>
                                    <div className="bg-red-500 p-5 rounded-3xl text-white shadow-lg shadow-red-100">
                                        <div className="text-[10px] font-black uppercase opacity-60 tracking-wider">今日異常</div>
                                        <div className="text-3xl font-black mt-1">{(records || []).filter(r => r && r.date === todayStr && r.status === 'fail').length}</div>
                                    </div>
                                </div>

                                {/* 年度考核表現總表 */}
                                <div className="space-y-3">
                                    <div className="flex items-center gap-2 px-2">
                                        <Icon name="medal" className="w-4 h-4 text-amber-500" />
                                        <h3 className="text-xs font-black text-slate-800 uppercase tracking-widest">{new Date().getFullYear()} 年度表現考核總表</h3>
                                    </div>
                                    <div className="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
                                        <div className="bg-slate-50 px-4 py-3 border-b flex justify-between text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                            <span>同仁姓名</span>
                                            <div className="flex gap-4">
                                                <span>累計異常</span>
                                                <span className="w-12 text-right">合格率</span>
                                            </div>
                                        </div>
                                        <div className="divide-y divide-slate-50">
                                            {annualStats.length === 0 ? (
                                                <div className="p-8 text-center text-slate-300 font-bold text-sm">尚無年度數據</div>
                                            ) : (
                                                annualStats.map(stat => (
                                                    <div key={stat.id} className="px-4 py-4 flex items-center justify-between transition-colors hover:bg-slate-50">
                                                        <div className="min-w-0 flex-1">
                                                            <div className="font-bold text-slate-800 flex items-center gap-2">
                                                                {stat.name}
                                                                {stat.passRate === 100 && stat.totalCount > 5 && <span className="text-[9px] bg-green-100 text-green-600 px-1.5 py-0.5 rounded-full">優良</span>}
                                                                {stat.passRate < 80 && <span className="text-[9px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full font-black">需注意</span>}
                                                            </div>
                                                            <div className="text-[9px] text-slate-400 font-bold uppercase">{stat.dept}</div>
                                                        </div>
                                                        <div className="flex items-center gap-4">
                                                            <div className={`text-sm font-black ${stat.failCount > 0 ? 'text-red-500' : 'text-slate-300'}`}>
                                                                {stat.failCount} <span className="text-[10px] opacity-40">次</span>
                                                            </div>
                                                            <div className="w-12 text-right">
                                                                <div className={`text-sm font-black ${stat.passRate >= 95 ? 'text-blue-600' : stat.passRate >= 80 ? 'text-amber-500' : 'text-red-600'}`}>
                                                                    {stat.passRate}%
                                                                </div>
                                                                <div className="w-full h-1 bg-slate-100 rounded-full mt-1 overflow-hidden">
                                                                    <div 
                                                                        className={`h-full transition-all duration-1000 ${stat.passRate >= 95 ? 'bg-blue-500' : stat.passRate >= 80 ? 'bg-amber-500' : 'bg-red-500'}`} 
                                                                        style={{ width: `${stat.passRate}%` }}
                                                                    />
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                    <p className="px-3 text-[9px] text-slate-400 font-medium leading-relaxed italic">
                                        * 此表格依據年度內所有抽查紀錄計算。合格率可作為年底考核加減分之重要依據。排名由合格率低至高排列。
                                    </p>
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-md border-t border-slate-100 p-2 pb-8 z-30 flex justify-around shadow-2xl">
                        <button onClick={() => setView('check')} className={`flex flex-col items-center p-3 rounded-2xl transition-all active-scale ${view === 'check' ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400'}`}><Icon name="clipboard" className="w-5 h-5"/><span className="text-[10px] font-black mt-1 uppercase">服儀檢查</span></button>
                        <button onClick={() => { if(isAdmin) setView('manage'); else { setShowLogin(true); setPwInput(''); setLoginErr(false); } }} className={`flex flex-col items-center p-3 rounded-2xl transition-all active-scale ${view === 'manage' ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400'}`}><Icon name="users" className="w-5 h-5"/><span className="text-[10px] font-black mt-1 uppercase">人員管理</span></button>
                        <button onClick={() => { if(isAdmin) setView('history'); else { setShowLogin(true); setPwInput(''); setLoginErr(false); } }} className={`flex flex-col items-center p-3 rounded-2xl transition-all active-scale ${view === 'history' ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-400'}`}><Icon name="chart" className="w-5 h-5"/><span className="text-[10px] font-black mt-1 uppercase">表現考核</span></button>
                    </nav>

                    {activeEmp && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-in fade-in duration-200">
                            <div className="bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-300 flex flex-col">
                                <div className="p-6 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                                    <div className="min-w-0 flex-1 pr-4"><h3 className="text-xl font-black text-slate-800 truncate">{(activeEmp.name || "未知")}</h3><p className="text-[10px] font-black text-slate-400 uppercase tracking-tighter truncate">{(activeEmp.dept || "未知")} 規範檢查</p></div>
                                    <button onClick={() => setActiveEmp(null)} className="p-2 text-slate-300 hover:text-slate-900 flex-shrink-0 transition-colors"><Icon name="x" /></button>
                                </div>
                                <div className="p-5 overflow-y-auto no-scrollbar space-y-3" style={{ maxHeight: '60vh' }}>
                                    <button onClick={() => { const items = getItems(activeEmp.dept); setTempChecks(items.reduce((a, i) => ({...a, [i]: true}), {})); }} className="w-full py-4 bg-green-500 text-white rounded-2xl font-black shadow-lg shadow-green-100 flex items-center justify-center gap-2 active-scale"><Icon name="check" className="w-5 h-5" /> 標記全部合格</button>
                                    <div className="h-4 border-b border-slate-100" />
                                    {getItems(activeEmp.dept).map((item, idx) => (
                                        <div key={idx} onClick={() => toggleCheckItem(item)} className={`p-4 rounded-xl border-2 flex gap-4 transition-all cursor-pointer ${tempChecks[item] ? 'border-slate-100 bg-white shadow-sm' : 'border-red-500 bg-red-50 shadow-md shadow-red-100'}`}>
                                            <div className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center flex-shrink-0 transition-all ${tempChecks[item] ? 'border-slate-200' : 'bg-red-500 border-red-500 text-white'}`}>{!tempChecks[item] && <Icon name="check" className="w-4 h-4" />}</div>
                                            <span className={`text-sm font-bold ${tempChecks[item] ? 'text-slate-500 font-medium' : 'text-red-700 font-black'}`}>{item}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-5 border-t border-slate-100 grid grid-cols-3 gap-3 bg-white">
                                    <button onClick={async () => {
                                        if(confirm('確認清除今日檢查紀錄？')) { 
                                            await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('records').doc(`${todayStr}_${activeEmp.id}`).delete();
                                            setActiveEmp(null); 
                                        } 
                                    }} className="text-slate-400 text-[10px] font-black uppercase hover:text-slate-600 transition-colors">清除紀錄</button>
                                    <button onClick={saveCheck} className="col-span-2 bg-slate-900 text-white py-4 rounded-2xl font-black shadow-xl active-scale">確認並儲存</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showLogin && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] flex items-center justify-center p-6 animate-in zoom-in-95 duration-200">
                            <div className="bg-white w-full max-w-sm rounded-[32px] p-8 text-center shadow-2xl">
                                <Icon name="lock" className="w-12 h-12 text-blue-600 mx-auto mb-4" />
                                <h2 className="text-2xl font-black mb-2 text-slate-800">管理端驗證</h2>
                                <p className="text-xs text-slate-400 font-bold mb-6 uppercase">RESTRICTED ACCESS</p>
                                <form onSubmit={handleLogin} className="space-y-4 text-left">
                                    <input autoFocus type="password" placeholder="請輸入管理密碼" className={`w-full p-4 bg-slate-100 rounded-2xl text-center text-xl font-bold border-2 transition-all outline-none ${loginErr ? 'border-red-500 animate-shake' : 'border-transparent focus:border-blue-500'}`} value={pwInput} onChange={e => {setPwInput(e.target.value); setLoginErr(false);}} />
                                    <button type="submit" className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-xl active-scale">登入系統</button>
                                    <button type="button" onClick={() => setShowLogin(false)} className="w-full text-center text-slate-400 text-xs font-bold mt-4 uppercase hover:text-slate-600 transition-colors">返回</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
